services:
  - type: web
    name: clipnote-server
    env: node
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 3001
      - key: CLIENT_URL
        value: https://clipnote-client.onrender.com

  - type: web
    name: clipnote-client
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_SERVER_URL
        value: https://clipnote-server.onrender.com
